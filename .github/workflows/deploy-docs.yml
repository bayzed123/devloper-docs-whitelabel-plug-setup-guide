name: Build and deploy documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SmartGen Docs
        run: python -m pip install --upgrade smartgen-docs

      - name: Build site
        run: smartgen-docs build

      - name: Copy documentation assets
        run: cp -R docs/assets site/assets

      - name: Copy project live-proof screenshots
        run: |
          for project in sidra-glow-studio harbal-pakriti jewellery-and-fashion lks-attire babyshop; do
            mkdir -p "site/projects/$project/live-proof"
            cp docs/projects/$project/live-proof/*.png "site/projects/$project/live-proof/"
          done

      - name: Remove theme-change controls
        run: python scripts/remove-theme-controls.py site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
